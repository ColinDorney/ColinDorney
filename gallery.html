<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Photos from Colin's travels, scouting, fitness and life adventures"><title>Photo Gallery | Colin Dorney</title><style>:root{color-scheme:dark;--bg:#121619;--panel:#1c2226;--ink:#f6f4ee;--muted:#b9bfc2;--gold:#d9b778}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}header{border-bottom:1px solid #ffffff20;background:#121619}nav{max-width:1200px;margin:auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px}nav a{color:inherit;text-decoration:none}nav a:hover{color:var(--gold)}nav strong{letter-spacing:.07em}main{max-width:1200px;margin:auto;padding:55px 24px 90px}h1{font:clamp(2.6rem,5vw,4.7rem)/1.1 Georgia,serif;margin:10px 0 18px}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.2em;font-size:12px;font-weight:700}p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:38px}.photo{border:1px solid #ffffff19;background:var(--panel);border-radius:10px;overflow:hidden;cursor:zoom-in;color:inherit;text-align:left;padding:0;font:inherit;transition:transform .2s}.photo:hover,.photo:focus-visible{transform:translateY(-4px);border-color:var(--gold)}.photo img{width:100%;height:230px;object-fit:cover;display:block}.photo span{display:block;padding:12px 14px;font-size:14px}.viewer{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;padding:24px;cursor:zoom-out}.viewer.open{display:flex}.viewer img{max-width:95vw;max-height:80vh;object-fit:contain}.viewer p{color:white;text-align:center}footer{border-top:1px solid #ffffff20;text-align:center;color:var(--muted);padding:24px}@media(max-width:520px){nav{padding:14px 16px}main{padding:35px 16px 60px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo img{height:160px}.photo span{font-size:12px;padding:8px}}a:focus-visible,button:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:3px}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}\n.filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.filters button{border:1px solid #ffffff45;border-radius:30px;padding:10px 16px;background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-size:14px}.filters button.active,.filters button:hover{background:var(--gold);color:#171a1c}#gallery-count{font-size:13px;margin:16px 0 -18px}.photo[hidden]{display:none!important}.viewer:focus-visible{outline:none}\n</style></head><body><header><nav><strong>COLIN DORNEY</strong><a href="index.html">← Back to Home</a></nav></header><main><div class="eyebrow">Life beyond work</div><h1>My Adventures.</h1><p>Travel, service, friends, fitness and memories. Click any photo to see it larger.</p><div class="filters" id="filters" aria-label="Photo categories"></div><p id="gallery-count" aria-live="polite"></p><div class="grid" id="photos"></div></main><div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Enlarged photo" tabindex="-1"><img id="large" alt=""><p id="caption"></p></div><footer>© <span id="year"></span> Colin Dorney</footer><script>const photos=[{"name":"A Monkey on My Head!.jpg","category":"Life & Memories","title":"A Monkey on My Head!"},{"name":"A Scenic View of Italy.jpg1.jpg","category":"Travel & Exploration","title":"A Scenic View of Italy"},{"name":"Adventure on the Water.jpg1.jpg","category":"Scouting & Service","title":"Adventure on the Water"},{"name":"Adventures in Las Vegas.jpg","category":"Travel & Exploration","title":"Adventures in Las Vegas"},{"name":"At the Texas State Capitol.jpg1.jpg","category":"Travel & Exploration","title":"At the Texas State Capitol"},{"name":"Caribbean Cruise Adventure.jpg","category":"Travel & Exploration","title":"Caribbean Cruise Adventure"},{"name":"Caribbean Island Views.jpg1.jpg","category":"Travel & Exploration","title":"Caribbean Island Views"},{"name":"Conquering Guadalupe Peak.jpg1.jpg","category":"Scouting & Service","title":"Conquering Guadalupe Peak"},{"name":"Conquering the Jailbreak Obstacle Course.jpg","category":"Fitness & Teamwork","title":"Conquering the Jailbreak Obstacle Course"},{"name":"CrossFit box jump.jpg1.jpg","category":"Fitness & Teamwork","title":"CrossFit box jump"},{"name":"CrossFit podium.jpg1.jpg","category":"Fitness & Teamwork","title":"CrossFit podium"},{"name":"Exploring Monkeyland.jpg","category":"Travel & Exploration","title":"Exploring Monkeyland"},{"name":"Exploring Underwater — Boy Scouts.jpg","category":"Scouting & Service","title":"Exploring Underwater — Boy Scouts"},{"name":"Exploring Venice by Gondola1.jpg","category":"Travel & Exploration","title":"Exploring Venice by Gondola"},{"name":"Exploring Wall Street, NYC.jpg","category":"Travel & Exploration","title":"Exploring Wall Street, NYC"},{"name":"Exploring the Colosseum, Rome.jpg1.jpg","category":"Travel & Exploration","title":"Exploring the Colosseum, Rome"},{"name":"Exploring the Roman Forum1.jpg","category":"Travel & Exploration","title":"Exploring the Roman Forum"},{"name":"Group photograph with project volunteers.jpg","category":"Scouting & Service","title":"Group photograph with project volunteers"},{"name":"Hands-On With Heavy Equipment.jpg1.jpg","category":"Scouting & Service","title":"Hands-On With Heavy Equipment"},{"name":"Inside the Colosseum1.jpg","category":"Travel & Exploration","title":"Inside the Colosseum"},{"name":"Lifeguard Memories.jpg1.jpg","category":"Life & Memories","title":"Lifeguard at Deaf Camp — “Mad Dog”"},{"name":"MadDog — Deaf camp in Oregon.jpg","category":"Life & Memories","title":"Lifeguard at Deaf Camp — “Mad Dog”"},{"name":"Making New Friends.jpg1.jpg","category":"Life & Memories","title":"Making New Friends"},{"name":"Mud football tackle.jpg1.jpg","category":"Fitness & Teamwork","title":"Mud football tackle"},{"name":"My CrossFit Community.jpg1.jpg","category":"Fitness & Teamwork","title":"My CrossFit Community"},{"name":"Outdoor adventure with dog (1).jpg","category":"Life & Memories","title":"Outdoor adventure with dog"},{"name":"Playground preparation and gravel work.jpg","category":"Scouting & Service","title":"Playground preparation and gravel work"},{"name":"Pushing Through the Challenge.jpg","category":"Fitness & Teamwork","title":"Pushing Through the Challenge"},{"name":"Ready for Another Cruise.jpg1.jpg","category":"Travel & Exploration","title":"Ready for Another Cruise"},{"name":"Rock Climbing Adventure.jpg","category":"Fitness & Teamwork","title":"Rock Climbing Adventure"},{"name":"Sailing With Friends.jpg","category":"Scouting & Service","title":"Sailing With Friends"},{"name":"St. Mark's Square, Venice.jpg","category":"Travel & Exploration","title":"St. Mark's Square, Venice"},{"name":"Surviving the Jailbreak Mud Challenge.jpg","category":"Fitness & Teamwork","title":"Surviving the Jailbreak Mud Challenge"},{"name":"Taking on the Climbing Wall.jpg","category":"Fitness & Teamwork","title":"Taking on the Climbing Wall"},{"name":"Target practice.jpg","category":"Life & Memories","title":"Target practice"},{"name":"The Mud Football Team.jpg","category":"Fitness & Teamwork","title":"The Mud Football Team"},{"name":"Three Generations Together.jpg","category":"Life & Memories","title":"Three Generations Together"},{"name":"Venice With Friends.jpg","category":"Travel & Exploration","title":"Venice With Friends"},{"name":"Visiting the Statue of Liberty.jpg","category":"Travel & Exploration","title":"Visiting the Statue of Liberty"},{"name":"Visiting the White House.jpg","category":"Travel & Exploration","title":"Visiting the White House"},{"name":"Volunteers working around the playground.jpg","category":"Scouting & Service","title":"Volunteers working around the playground"},{"name":"Washington, D.C. With Friends.jpg","category":"Travel & Exploration","title":"Washington, D.C. With Friends"},{"name":"Working Alongside My Dad.jpg","category":"Scouting & Service","title":"Working Alongside My Dad"},{"name":"Working Together on the Water.jpg","category":"Scouting & Service","title":"Working Together on the Water"},{"name":"You standing beside the playground improvements.jpg","category":"Scouting & Service","title":"You standing beside the playground improvements"},{"name":"Nights Around the Campfire.jpg1.jpg","category":"Scouting & Service","title":"Nights Around the Campfire"},{"name":"Eagle Scout Project Meeting With Children's Homes1.jpg","category":"Scouting & Service","title":"Eagle Scout Project Meeting With Children's Homes"}];const imageVariants=name=>{const m=name.match(/^(.*?)(\.(?:jpe?g|png|webp))$/i);if(!m)return[name];const base=m[1],ext=m[2];return [...new Set([name,base+'1'+ext,base+'.jpg1.jpg',base+' 1'+ext])]};const bestImage=name=>new Promise(resolve=>{const options=imageVariants(name);let pending=options.length,best={src:encodeURI(name),area:0};options.forEach(candidate=>{const im=new Image();const finish=()=>{if(--pending===0)resolve(best.src)};im.onload=()=>{const area=im.naturalWidth*im.naturalHeight;if(area>best.area)best={src:encodeURI(candidate),area};finish()};im.onerror=finish;im.src=encodeURI(candidate)})});const uniquePhotos=items=>{const seen=new Set();return items.filter(p=>{const key=p.name.toLowerCase().replace(/(?:\.jpg)?1\.jpg$/i,'.jpg').replace(/[^a-z0-9]/g,'');if(seen.has(key))return false;seen.add(key);return true})};const root=document.getElementById('photos'),viewer=document.getElementById('viewer'),large=document.getElementById('large'),caption=document.getElementById('caption');document.getElementById('year').textContent=new Date().getFullYear();const allPhotos=uniquePhotos(photos);const filterBar=document.getElementById('filters');const categories=['All',...new Set(allPhotos.map(p=>p.category))];const filterButtons=[];const photoButtons=[];const applyFilter=category=>{photoButtons.forEach(({btn,p})=>{btn.hidden=category!=='All'&&p.category!==category});filterButtons.forEach(({btn,name})=>{btn.classList.toggle('active',name===category);btn.setAttribute('aria-pressed',String(name===category))});document.getElementById('gallery-count').textContent=photoButtons.filter(x=>!x.btn.hidden).length+' photos'};categories.forEach(name=>{const btn=document.createElement('button');btn.type='button';btn.textContent=name;btn.addEventListener('click',()=>applyFilter(name));filterBar.append(btn);filterButtons.push({btn,name})});allPhotos.forEach(p=>{const btn=document.createElement('button');btn.className='photo';const img=document.createElement('img');img.src=encodeURI(p.name);bestImage(p.name).then(src=>{img.src=src});img.alt=p.title;img.loading='lazy';const title=document.createElement('span');title.textContent=p.title;btn.append(img,title);btn.addEventListener('click',()=>{large.src=img.src;large.alt=p.title;caption.textContent=p.title;viewer.classList.add('open');viewer.focus()});root.append(btn);photoButtons.push({btn,p})});applyFilter('All');viewer.addEventListener('click',()=>viewer.classList.remove('open'));document.addEventListener('keydown',e=>{if(e.key==='Escape')viewer.classList.remove('open')});</script></body></html>
